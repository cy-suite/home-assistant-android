name: Mirror Upstream Releases

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 6:00 AM UTC (after sync-upstream workflow)
    - cron: "0 6 * * 0"

permissions:
  contents: write

jobs:
  mirror-releases:
    name: Mirror Releases from Upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Mirror Latest Releases
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const upstreamOwner = 'home-assistant';
            const upstreamRepo = 'android';

            // Get the latest 10 releases from upstream
            const { data: upstreamReleases } = await github.rest.repos.listReleases({
              owner: upstreamOwner,
              repo: upstreamRepo,
              per_page: 10,
            });

            // Get existing releases in this fork
            const { data: forkReleases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existingTags = new Set(forkReleases.map(r => r.tag_name));

            for (const release of upstreamReleases) {
              if (existingTags.has(release.tag_name)) {
                console.log(`Release ${release.tag_name} already exists, skipping...`);
                continue;
              }

              console.log(`Creating release ${release.tag_name}...`);

              try {
                // Create the release in the fork
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: release.tag_name,
                  target_commitish: release.target_commitish,
                  name: release.name,
                  body: `> **Note:** This release is mirrored from [upstream home-assistant/android](https://github.com/home-assistant/android/releases/tag/${release.tag_name}). For release assets (APKs), please download from the upstream release.\n\n---\n\n${release.body}`,
                  draft: release.draft,
                  prerelease: release.prerelease,
                });
                console.log(`Successfully created release ${release.tag_name}`);
              } catch (error) {
                console.error(`Failed to create release ${release.tag_name}: ${error.message}`);
              }
            }
