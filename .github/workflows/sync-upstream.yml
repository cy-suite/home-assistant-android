name: Sync Fork with Upstream

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 5:00 AM UTC (after upstream weekly release)
    - cron: "0 5 * * 0"

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/home-assistant/android.git || true
          git remote -v

      - name: Fetch Upstream
        run: |
          git fetch upstream --tags --force

      - name: Merge Upstream Changes
        run: |
          git checkout main
          # Check if there are changes to merge
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "Already up to date with upstream"
          else
            echo "Merging upstream changes..."
            if ! git merge upstream/main --no-edit --allow-unrelated-histories; then
              echo "::error::Merge failed - manual intervention required"
              exit 1
            fi
          fi

      - name: Push Changes
        run: |
          echo "Pushing changes to origin..."
          git push origin main --force-with-lease

      - name: Push Tags
        run: |
          echo "Pushing tags to origin..."
          git push origin --tags --force
